# Stack de monitoreo: Prometheus + Grafana (kube-prometheus-stack).
# Se instala con: observability/setup-observabilidad.sh
# NOTA: el Pushgateway ya NO viene incluido en este chart; se instala aparte
# (ver setup-observabilidad.sh) con el chart prometheus-community/prometheus-pushgateway.

grafana:
  enabled: true
  # Cambiar en un entorno real. Para el entorno simulado de la evaluacion alcanza.
  adminPassword: admin
  service:
    type: LoadBalancer
  # el sidecar importa automaticamente dashboards (label grafana_dashboard) y
  # datasources (label grafana_datasource) desde ConfigMaps
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

# Componentes no necesarios para el demo: se deshabilitan para ahorrar recursos
# (importante en minikube con memoria limitada).
alertmanager:
  enabled: false

prometheus-node-exporter:
  enabled: false
