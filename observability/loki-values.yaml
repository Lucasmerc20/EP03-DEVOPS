# Loki + Promtail para centralizar los logs del microservicio.
# Se instala con: observability/setup-observabilidad.sh

loki:
  enabled: true

promtail:
  enabled: true
  # promtail recolecta los logs de los contenedores en /var/log/pods
  config:
    snippets:
      pipelineStages:
        - docker: {}

# Grafana ya viene con kube-prometheus-stack, no se instala aqui
grafana:
  enabled: false
