# Deployment para pruebas LOCALES con minikube.
# Usa la imagen construida localmente (pagos-svc:local) en lugar de GHCR.
# Construccion previa:
#   docker build -t pagos-svc:local .
#   minikube image load pagos-svc:local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos-svc
  namespace: pagos
  labels:
    app.kubernetes.io/name: pagos-svc
    app.kubernetes.io/part-of: pagos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pagos-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagos-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: pagos-svc
          image: pagos-svc:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
