apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos-svc
  namespace: pagos
  labels:
    app.kubernetes.io/name: pagos-svc
    app.kubernetes.io/part-of: pagos
spec:
  # 2 replicas, igual que en el entorno simulado de Docker Compose
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pagos-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagos-svc
      # anotaciones que usa Prometheus para descubrir y raspar el microservicio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: pagos-svc
          # IMAGE_TAG_PLACEHOLDER se reemplaza en el pipeline por el SHA del commit
          image: ghcr.io/lucasmerc20/ep02-devops:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # limites de recursos (reflejan los del docker-compose)
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
      # Si el paquete de GHCR es privado, crea un secret de pull y descomenta esto.
      # Alternativa simple: hacer publico el paquete en GHCR (Settings > Packages).
      # imagePullSecrets:
      #   - name: ghcr-secret
