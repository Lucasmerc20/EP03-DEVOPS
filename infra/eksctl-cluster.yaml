# Cluster EKS para el microservicio pagos-svc.
# Creacion: eksctl create cluster -f eksctl-cluster.yaml
# Requiere: AWS CLI + eksctl configurados, y permisos IAM para crear el cluster.

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: pagos-cluster
  region: us-east-1

managedNodeGroups:
  - name: ng-pagos
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
